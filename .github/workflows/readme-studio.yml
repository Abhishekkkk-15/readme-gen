# ReadMe Studio — example CI workflow
# Install the CLI when published, then generate a README on each release tag.
name: README Studio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  generate-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Replace with the published package name when available:
      # - run: npm install -g @readme-studio/cli
      # - run: readme-studio generate --repo . --out README.md
      - name: Placeholder — wire CLI here
        run: |
          echo "Add: npm install -g @readme-studio/cli"
          echo "Then: readme-studio generate --repo . --model gpt-4o"

